# Daily update: every morning, fetch fresh numbers and republish the site.
name: Daily data update

on:
  schedule:
    - cron: "30 11 * * *"   # every day at 11:30 UTC (about 7:30am Eastern)
  workflow_dispatch:         # adds a "Run workflow" button for running it by hand
  push:
    branches: [main]         # also runs whenever you upload new files

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the site's files
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download fresh numbers and apply the wording rules
        run: node scripts/update-data.mjs

      - name: Gather the website files
        run: |
          mkdir _site
          cp index.html style.css *.js _site/
          cp -r public-data _site/

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
